schema_version: "1.1"
name: single-skill-broken-cli
expected_outcome: |
  Audits only the defuddle skill (both the user and codex copies). Detects that the
  `defuddle` CLI is not on PATH, looks up the current npm version, rates the skill
  broken (or outdated if the CLI is found) with a cited source, and recommends the
  exact install command from the skill. Does not install anything.
